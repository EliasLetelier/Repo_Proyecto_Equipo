<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superclásico Siglo XXI</title>

    <!-- Librerías Vega -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        #vis {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Superclásico Siglo XXI: Victorias, Empates e Hitos por Penales</h1>

    <div id="vis"></div>

    <script>
        const spec = {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

            "description": "Resultados históricos del Superclásico chileno",

            "data": {
                "values": [

                    {
                        "Fechas": "2006-12-23",
                        "Ganador": "Colo-Colo",
                        "Goles_U": "1(2)",
                        "Goles_CC": "0(4)",
                        "Estadio": "Estadio Nacional",
                        "Tipo_Definicion": "Definición por Penales"
                    },

                    {
                        "Fechas": "2012-06-24",
                        "Ganador": "U de Chile",
                        "Goles_U": "5",
                        "Goles_CC": "0",
                        "Estadio": "Estadio Nacional",
                        "Tipo_Definicion": "Tiempo Reglamentario"
                    },

                    {
                        "Fechas": "2015-11-25",
                        "Ganador": "U de Chile",
                        "Goles_U": "1(5)",
                        "Goles_CC": "1(3)",
                        "Estadio": "La Portada",
                        "Tipo_Definicion": "Definición por Penales"
                    },

                    {
                        "Fechas": "2021-09-26",
                        "Ganador": "Colo-Colo",
                        "Goles_U": "1",
                        "Goles_CC": "3",
                        "Estadio": "El Teniente",
                        "Tipo_Definicion": "Tiempo Reglamentario"
                    },

                    {
                        "Fechas": "2023-03-12",
                        "Ganador": "Empate",
                        "Goles_U": "0",
                        "Goles_CC": "0",
                        "Estadio": "Monumental",
                        "Tipo_Definicion": "Tiempo Reglamentario"
                    }
                ]
            },

            "mark": {
                "type": "point",
                "filled": true,
                "size": 200
            },

            "encoding": {

                "x": {
                    "field": "Fechas",
                    "type": "temporal",
                    "title": "Año del Encuentro"
                },

                "y": {
                    "field": "Ganador",
                    "type": "nominal",
                    "title": "Ganador"
                },

                "color": {
                    "field": "Ganador",
                    "type": "nominal",
                    "scale": {
                        "domain": ["U de Chile", "Colo-Colo", "Empate"],
                        "range": ["#003399", "#000000", "#808080"]
                    },
                    "title": "Resultado"
                },

                "shape": {
                    "field": "Tipo_Definicion",
                    "type": "nominal",
                    "title": "Tipo de Definición"
                },

                "tooltip": [
                    {"field":"Fechas","type":"temporal","title":"Fecha"},
                    {"field":"Goles_U","type":"nominal","title":"Goles U de Chile"},
                    {"field":"Goles_CC","type":"nominal","title":"Goles Colo-Colo"},
                    {"field":"Estadio","type":"nominal"},
                    {"field":"Tipo_Definicion","type":"nominal","title":"Definición"}
                ]
            },

            "width": 750,
            "height": 400,

            "title": {
                "text": "Superclásico Siglo XXI: Victorias, Empates e Hitos por Penales",
                "fontSize": 24,
                "anchor": "start"
            }
        };

        vegaEmbed('#vis', spec);
    </script>

</body>
</html>
