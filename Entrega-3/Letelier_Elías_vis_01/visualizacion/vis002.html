<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frecuencia y Asistencia por Estadio</title>

    <!-- Librerías Vega -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        #vis {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Frecuencia y Asistencia por Estadio</h1>

    <div id="vis"></div>

    <script>

        const spec = {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

            "description": "Cantidad de partidos y promedio de público por estadio",

            "data": {
                "values": [

                    {
                        "Estadio": "Estadio Monumental",
                        "Cantidad_Partidos": 20,
                        "Promedio_Publico": 35000
                    },

                    {
                        "Estadio": "Estadio Nacional",
                        "Cantidad_Partidos": 18,
                        "Promedio_Publico": 42000
                    },

                    {
                        "Estadio": "Santa Laura",
                        "Cantidad_Partidos": 8,
                        "Promedio_Publico": 15000
                    },

                    {
                        "Estadio": "El Teniente",
                        "Cantidad_Partidos": 5,
                        "Promedio_Publico": 12000
                    },

                    {
                        "Estadio": "La Portada",
                        "Cantidad_Partidos": 3,
                        "Promedio_Publico": 18000
                    }

                ]
            },

            "mark": "bar",

            "encoding": {

                "y": {
                    "field": "Estadio",
                    "type": "nominal",
                    "sort": "-x",
                    "title": "Recinto Deportivo"
                },

                "x": {
                    "field": "Cantidad_Partidos",
                    "type": "quantitative",
                    "title": "Partidos Jugados"
                },

                "color": {
                    "field": "Promedio_Publico",
                    "type": "quantitative",
                    "title": "Promedio Público",

                    "scale": {
                        "scheme": "greens"
                    }
                },

                "tooltip": [
                    {"field":"Estadio","type":"nominal"},
                    {"field":"Cantidad_Partidos","type":"quantitative","title":"Partidos"},
                    {"field":"Promedio_Publico","type":"quantitative","title":"Promedio Público"}
                ]
            },

            "width": 700,
            "height": 450,

            "title": {
                "text": "Frecuencia y Asistencia por Estadio",
                "fontSize": 24,
                "anchor": "start"
            }
        };

        vegaEmbed('#vis', spec);

    </script>

</body>
</html>
